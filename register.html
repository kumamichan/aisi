<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ぴたリスト 登録ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムの入力ページ。上に充実度、下に保存ボタンを固定 */
:root{
  --night:#141a26; --night-2:#1e2738; --paper:#f3f1ec; --card:#fbfaf7; --ink:#1b2130; --ink-soft:#5a6274;
  --line:#ddd8cd; --accent:#d9b77a; --accent-ink:#2a2112; --ok:#2e8b57; --warn:#b23b2a;
  --font-voice:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);line-height:1.7;font-size:15px}
header{background:var(--night);color:var(--paper);padding:16px max(16px,env(safe-area-inset-left,0px)) 18px}
.hin{max-width:760px;margin:0 auto;display:grid;gap:8px}
.logo{font-family:var(--font-voice);letter-spacing:.1em;font-size:1.3rem}
.logo small{font-family:var(--font-ui);letter-spacing:.1em;font-size:.72rem;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:3px}
h1{margin:0;font-family:var(--font-voice);font-size:1.35rem;font-weight:700}
.meter{display:grid;gap:4px}
.meter-h{display:flex;justify-content:space-between;font-size:.8rem;color:#c9ced8}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9fb6d9,var(--accent));transition:width .4s}
.hint{font-size:.78rem;color:#c9ced8;margin:0}
main{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 120px;display:grid;gap:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px;min-width:0}
section h2{margin:0;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
section h2 small{font-weight:400;color:var(--ink-soft);font-size:.75rem}
.lead{margin:-6px 0 0;font-size:.82rem;color:var(--ink-soft)}
label.f{display:grid;gap:4px;font-size:.86rem;font-weight:500}
label.f small{font-weight:400;color:var(--ink-soft);font-size:.76rem}
input[type=text],input[type=url],input[type=email],input[type=number],select,textarea{font:inherit;font-size:16px;width:100%;border:1px solid #cfc9bd;border-radius:6px;padding:9px 11px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.84rem;border:1px solid #cfc9bd;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--night-2);border-color:var(--night-2);color:#fff;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #cfc9bd;border-radius:6px;overflow:hidden}
.seg.s5{grid-template-columns:repeat(5,1fr)}
.seg button{font:inherit;font-size:.8rem;border:0;border-right:1px solid #e3ded3;background:#fff;padding:7px 2px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--night-2);color:#fff;font-weight:700}
.seg-l{display:flex;justify-content:space-between;font-size:.72rem;color:var(--ink-soft);margin-top:2px}
.feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;font-size:.86rem}
.grp{font-size:.78rem;letter-spacing:.08em;color:var(--ink-soft);margin:6px 0 -6px}
.menu{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;background:#fff}
.menu b{font-size:.85rem}
.staff{display:grid;gap:8px}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.st .nm{font-weight:700}
.st small{display:block;color:var(--ink-soft);font-size:.75rem}
.st .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;border-radius:6px;border:1px solid var(--night-2);background:var(--night-2);color:#fff;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.sub{background:#fff;color:var(--ink);border-color:#cfc9bd;font-weight:500;padding:6px 10px;font-size:.8rem}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.pub{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--ink-soft);font-weight:400;cursor:pointer}
.pub input{width:auto}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ph-slot{display:grid;gap:6px;align-content:start;min-width:0}
.ph-box{aspect-ratio:4/3;border:1px dashed #cfc9bd;border-radius:8px;background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:.75rem;color:var(--ink-soft);text-align:center;padding:4px}
.ph-box img{width:100%;height:100%;object-fit:cover}
.ph-slot .btn.sub{text-align:center;cursor:pointer}
.face-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.face{width:96px;height:96px;border-radius:50%;background:var(--night-2);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:700;overflow:hidden}
.face img{width:100%;height:100%;object-fit:cover}
.face-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.face-act .btn.sub{cursor:pointer}
@media (max-width:560px){.photos{grid-template-columns:1fr 1fr}}
.agree{background:#fff6e5;border:1px solid #ecd3a4;border-radius:8px;padding:12px;font-size:.85rem;display:flex;gap:10px;align-items:flex-start}
.agree input{margin-top:4px;width:auto}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(251,250,247,.96);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.bin{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.msg{font-size:.85rem;color:var(--ink-soft)}
.msg.ok{color:var(--ok);font-weight:700}
.msg.err{color:var(--warn);font-weight:700}
.center{padding:60px 16px;text-align:center;color:var(--ink-soft)}
.warnline{color:var(--warn)!important;font-weight:700}
/* AISIと話しながら入力する */
.wz-open{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:var(--night);color:var(--paper);border-radius:10px;padding:14px;border:0;font:inherit;text-align:left;cursor:pointer}
.wz-open img{width:64px;height:64px;object-fit:cover;object-position:top;border-radius:50%;background:var(--night-2)}
.wz-open b{display:block;font-size:1rem}
.wz-open small{color:#c9ced8;font-size:.8rem}
.wz{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.wz-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-size:.85rem}
.wz-hb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wz-h{gap:8px}
.wz-h button{font:inherit;background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;cursor:pointer}
.wz-log{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:640px;width:100%;margin:0 auto}
.wz-m{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:end}
.wz-m img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;background:var(--night-2)}
.wz-m p{margin:0;background:var(--paper);color:var(--ink);border-radius:14px 14px 14px 4px;padding:10px 13px;font-family:var(--font-voice);font-size:.95rem;line-height:1.7}
.wz-me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px;padding:8px 13px;font-size:.88rem;font-weight:700;max-width:85%}
.wz-sum{background:#fff6e5;color:var(--ink);border:1px solid #ecd3a4;border-radius:10px;padding:12px;font-size:.9rem;line-height:1.8}
.wz-a{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1);background:var(--night-2);max-height:48vh;overflow-y:auto}
.wz-ain{max-width:640px;margin:0 auto;display:grid;gap:10px}
.wz-a .chip{background:rgba(243,241,236,.92);border-color:transparent;padding:8px 14px;font-size:.9rem}
.wz-a .chip.on{background:var(--accent);color:var(--accent-ink)}
.wz-a .row{display:flex;gap:8px}
.wz-a .row .btn{flex:1}
.wz-a .btn:not(.skip){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wz-a .btn.skip{background:transparent;border-color:rgba(255,255,255,.35);color:var(--paper);font-weight:500}
.wz-a input{font-size:16px}
@media (max-width:560px){.row2{grid-template-columns:1fr}.feat{grid-template-columns:1fr;gap:4px}}
/* ===== 11/13 わかりやすくした登録画面 ===== */
.flow3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;counter-reset:f}
.flow3 li{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;line-height:1.35;color:var(--ink-soft)}
.flow3 li b{flex:none;width:24px;height:24px;border-radius:50%;background:#e8e3d8;color:var(--ink);display:grid;place-items:center;font-size:.8rem}
.flow3 li small{display:block;font-size:.68rem;opacity:.8}
.flow3 li.now{border:2px solid var(--accent);background:#fffaf0;color:var(--ink);font-weight:700}
.flow3 li.now b{background:var(--accent);color:var(--accent-ink)}
.flow3 li.done b{background:var(--ok);color:#fff}
.checks{background:var(--night);color:var(--paper);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.checks>b{font-size:.95rem}
.checks small{display:block;color:#c9ced8;font-size:.76rem}
.checks div{display:flex;flex-wrap:wrap;gap:6px}
.ck{font:inherit;font-size:.78rem;border:1px solid rgba(255,255,255,.3);background:transparent;color:#c9ced8;border-radius:999px;padding:3px 10px;cursor:pointer}
.ck.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.stepnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.stepnav button{flex:none;font:inherit;font-size:.8rem;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.stepnav button i{font-style:normal;width:18px;height:18px;border-radius:50%;background:#e8e3d8;display:grid;place-items:center;font-size:.7rem}
.stepnav button.ok i{background:var(--ok);color:#fff}
.stepnav button.on{background:var(--night-2);color:#fff;border-color:var(--night-2);font-weight:700}
.stepnav button.opt{border-style:dashed}
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.panels{display:grid;gap:16px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.say{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.say img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;background:var(--night-2);border:2px solid var(--accent)}
.say p{margin:0;background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 13px;font-size:.92rem;line-height:1.75}
.say p b{color:#8a6a2e}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.nav .btn{padding:11px 18px}
.tip{font-size:.78rem;color:var(--ink-soft);margin:0}
.fl{font-size:.86rem;font-weight:500;display:block}
.fl small{font-weight:400;color:var(--ink-soft);font-size:.74rem;margin-left:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px}
.ph-slot.opt .ph-box{opacity:.8}
.fzs{display:flex;flex-wrap:wrap;gap:6px}
.fz{font:inherit;font-size:.86rem;border:1px solid #cfc9bd;background:#fff;color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.fz.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.fz.on::before{content:"★ "}
.fz.off{background:#eee;color:#9a9a9a;text-decoration:line-through;border-color:#ddd}
.legend{font-size:.76rem;color:var(--ink-soft);margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend .fz{font-size:.72rem;padding:2px 8px;cursor:default}
details.more{border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:.9rem}
details.more[open]{padding-bottom:12px;display:grid;gap:10px}
.mini3{margin:0;padding-left:1.3em;font-size:.86rem;display:grid;gap:2px}
.invite{display:grid;gap:10px}
.inv-b{display:flex;flex-wrap:wrap;gap:8px}
.btn.line{background:#06c755;border-color:#06c755;color:#fff;text-decoration:none;display:inline-flex;align-items:center}
.qr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;justify-items:center;gap:8px;text-align:center}
.qr p{margin:0;font-size:.8rem;color:var(--ink-soft)}
.badge{display:inline-block;font-size:.7rem;font-weight:700;border-radius:999px;padding:1px 8px;vertical-align:2px}
.b-inv{background:#eee;color:#666}.b-wait{background:#fde7c4;color:#8a5a00}.b-doing{background:#e2ebf7;color:#2a4f86}.b-ok{background:#d9f0e2;color:#1f6b40}.b-off{background:#f0e0de;color:#8b2c22}
.sbar{height:6px;background:#ece7dc;border-radius:3px;overflow:hidden;margin:6px 0 2px}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#9fb6d9,var(--accent))}
/* 見本カード（お客さまに見える画面） */
.pv{position:sticky;top:12px;display:grid;gap:6px}
.pv-h{margin:0;font-size:.75rem;letter-spacing:.08em;color:var(--ink-soft);text-align:center}
.pc{background:var(--paper);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(20,26,38,.18);border:6px solid var(--night);font-size:.8rem}
.pc .hl{outline:3px solid var(--accent);outline-offset:-3px;box-shadow:0 0 0 4px rgba(217,183,122,.35) inset;animation:hlp 1.6s ease-in-out infinite}
@keyframes hlp{50%{outline-color:#f3d79a}}
@media (prefers-reduced-motion:reduce){.pc .hl{animation:none}}
.pc-ph{aspect-ratio:16/9;background:#d8cfbd;display:grid;place-items:center;color:#7b7466;font-size:.75rem}
.pc-ph img{width:100%;height:100%;object-fit:cover}
.pc-h{padding:10px 12px;border-bottom:1px solid #e2ded5}
.pc-r{display:flex;justify-content:space-between;align-items:baseline;font-size:.66rem;letter-spacing:.1em;color:var(--ink-soft)}
.pc-r b{font-family:var(--font-voice);font-size:1.3rem;color:var(--ink);letter-spacing:0}
.pc-h h3{margin:2px 0;font-family:var(--font-voice);font-size:1.05rem}
.pc-h p{margin:0;font-size:.7rem;color:var(--ink-soft)}
.pc-b{padding:10px 12px;display:grid;gap:8px}
.pc-menu{background:#fff;border:1px solid #e2ded5;border-radius:6px;padding:6px 8px;display:grid;gap:1px}
.pc-menu small{font-size:.62rem;color:#8a6a2e;font-weight:700}
.pc-menu em{font-style:normal;color:var(--ink-soft)}
.pc-menu span{font-size:.66rem;color:var(--ink-soft)}
.pc-c p{margin:0;line-height:1.6}
.pc-c .ph{color:#aaa}
.pc-t{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pc-t span{font-size:.64rem;background:#e8e4da;border-radius:999px;padding:1px 7px}
.pc-why{background:#fbf3e3;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;padding:6px 8px}
.pc-why b{font-size:.66rem;color:#8a6a2e}
.pc-why ul{margin:2px 0 0;padding-left:1.1em}
.pc-st{display:flex;gap:8px;align-items:center;border-top:1px dashed #d4cfc4;padding-top:8px}
.pc-st .av{width:34px;height:34px;border-radius:50%;background:var(--night-2);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.pc-st .av img{width:100%;height:100%;object-fit:cover}
.pc-st small{display:block;font-size:.66rem;color:var(--ink-soft)}
.pc-btn{background:var(--ink);color:#fff;text-align:center;border-radius:4px;padding:8px;font-weight:700}
/* スタッフ */
.quick{border:2px solid var(--accent)}
.q3{display:grid;gap:14px}
.q3i{display:grid;gap:8px}
.q3i>b{display:flex;align-items:center;gap:8px;font-size:.92rem}
.q3i>b i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem}
.q3i>b small{font-weight:400;color:var(--ink-soft);font-size:.74rem}
.chips.sm .chip{font-size:.76rem;padding:3px 10px}
.q3s{font-size:.82rem;color:var(--ink-soft)}
.q3s b{color:var(--ok)}
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.ch.done{border-color:var(--ok)}
.ch-h{display:flex;justify-content:space-between;gap:6px;font-size:.88rem}
.ch-h span{font-size:.75rem;color:var(--ink-soft);white-space:nowrap}
.ch p{margin:0;font-size:.78rem;color:var(--ink-soft)}
.ch .btn{justify-self:start}
.st-wiz{grid-template-columns:1fr}
.st-wiz .pv{position:static;max-width:360px;justify-self:center;width:100%}
details.full{display:grid;gap:16px}
details.full>summary{cursor:pointer;background:#fff;border:1px dashed #cfc9bd;border-radius:10px;padding:12px 16px;font-weight:700;font-size:.9rem;list-style:none}
details.full>summary::-webkit-details-marker{display:none}
details.full>summary::after{content:"＋";float:right;color:#8a6a2e}
details.full[open]>summary::after{content:"−"}
details.full[open]>section{margin-top:16px}
@media (max-width:860px){
  .wiz{grid-template-columns:1fr}
  .pv{position:static;max-width:360px;justify-self:center;width:100%}
  .row4{grid-template-columns:1fr 1fr}
}
main:has(.wiz){max-width:1040px}
#save{white-space:nowrap;flex:none}
@media (max-width:560px){
  .flow3 li{padding:6px;font-size:.7rem;gap:5px}
  .flow3 li small{display:none}
  .flow3 li b{width:20px;height:20px;font-size:.7rem}
  .msg{font-size:.76rem}
}
</style>
<script src="js/bx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<header>
  <div class="hin">
    <div class="logo">ぴたリスト<small id="kind">登録</small></div>
    <h1 id="title">読み込み中…</h1>
    <div class="meter" id="meterBox" hidden>
      <div class="meter-h"><span>プロフィール充実度</span><span id="pct">0%</span></div>
      <div class="bar"><i id="bar" style="width:0"></i></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>
</header>
<main id="app"><div class="center">読み込み中…</div></main>
<div class="bottom" id="bottom" hidden>
  <div class="bin"><span class="msg" id="msg">「次へ」や「保存する」で保存されます。</span><button class="btn" id="save" type="button">いま保存する</button></div>
</div>

<script>

const list = v => Array.isArray(v) ? v : String(v||"").split("、").map(x=>x.trim()).filter(Boolean);

function chips(id, opts, selected, multi){
  const sel = list(selected);
  return `<div class="chips" data-chips="${id}" data-multi="${multi?1:0}">${opts.map(o=>`<button type="button" class="chip ${sel.includes(o)?"on":""}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("")}</div>`;
}
function chipVal(id){ const box=document.querySelector(`[data-chips="${id}"]`); return [...box.querySelectorAll(".chip.on")].map(b=>b.dataset.v); }
function seg(id, levels, val, cls){
  return `<div class="seg ${cls||""}" data-seg="${id}">${levels.map(([v,l])=>`<button type="button" data-v="${v}" class="${String(val)===String(v)?"on":""}">${esc(l)}</button>`).join("")}</div>`;
}
function segVal(id){ const b=document.querySelector(`[data-seg="${id}"] .on`); return b ? b.dataset.v : ""; }
function opts(arr, val, blank){ return (blank?`<option value="">${blank}</option>`:"") + arr.map(o=>{ const [v,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(v)}" ${String(val)===String(v)?"selected":""}>${esc(l)}</option>`; }).join(""); }
function wire(){
  document.querySelectorAll("[data-chips]").forEach(box=>box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    if (box.dataset.multi!=="1") box.querySelectorAll(".chip").forEach(x=>{ if(x!==b){x.classList.remove("on");x.setAttribute("aria-pressed","false");} });
    b.classList.toggle("on"); b.setAttribute("aria-pressed", b.classList.contains("on")); dirty();
  }));
  document.querySelectorAll("[data-seg]").forEach(box=>box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    box.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); dirty();
  }));
  document.querySelectorAll("#app input,#app select,#app textarea").forEach(el=>el.addEventListener("input",dirty));
}

/* 全体の流れ（どの画面にも出す）。now＝いまの段階（1〜3） */

  const L = [["お店のこと","管理者・約10分"],["スタッフを招待","1分"],["スタッフが自分のことを入力","1人5分〜"]];
  return `<ol class="flow3">${L.map(([t,s],i)=>`<li class="${i+1===now?"now":i+1<now?"done":""}"><b>${i+1}</b><span>${t}<small>${s}</small></span></li>`).join("")}</ol>`;
}

/* 保存（silent＝「次へ」などでの自動保存） */
let saving = false;
async function doSave(silent){
  const m=$("msg");
  if (MODE==="staff" && !$("agree").checked){ if (!silent){ m.className="msg err"; m.textContent="「同意する」にチェックを入れてください。"; const a=$("agree"); if (a) a.scrollIntoView({behavior:"smooth",block:"center"}); } return false; }
  if (saving) return false; saving = true;
  const b=$("save"); b.disabled=true; b.textContent="保存中…";
  const r = await api({type: MODE==="salon"?"save_salon":"save_staff", key:KEY, data: MODE==="salon"?collectSalon():collectStaff()});
  b.disabled=false; b.textContent="いま保存する"; saving = false;
  if (r && r.ok){ m.className="msg ok"; m.textContent="保存しました。診断結果にすぐ反映されます。";
    if (r.done!=null){ D["プロフィール充実度"]=r.done; if (MODE==="staff") staffMeter(); }
    if (r.near) m.textContent = "保存しました。住所の近くに、先に登録しているサロンがあるため、診断に出る前に運営から確認のご連絡をします。";
    else if (r.outside) m.textContent = "保存しました。2027年2月15日までは札幌市中央区のお店だけを紹介しています。運営から確認のご連絡をします。";
    return true; }
  m.className="msg err"; m.textContent="保存できませんでした。電波の良いところで、もう一度お試しください。"; return false;
}

function staffState(s){

  if (s.line === "wait") return ["wait", "承認待ち", "サロンさま窓口LINEに届いた「承認する」を押してください。"];
  if (!s.photo || !s.spec || s.done < 15) return ["doing", "入力中", `入力 ${s.done}%：顔写真・得意なこと・ひとことが入ると、診断に出られます。`];
  return s.on ? ["ok", "診断に出ています", `入力 ${s.done}%：AISIとの会話に答えるほど、選ばれやすくなります。`] : ["off", "診断に出していません", "「診断に出す」にチェックを入れると出ます。"];
}
function dirtyNow(){ return $("msg").textContent.startsWith("変更があります"); }
async function goStep(i, fromNav){
  if (fromNav || dirtyNow()) await doSave(true);

  document.querySelectorAll(".panel").forEach(p=>p.hidden = p.dataset.step !== SALON_STEPS[sStep].k);

  const f = document.querySelector(".flow3"); if (f) f.outerHTML = flow3(sStep===6?2:1);

}
function showQr(){

}

/* ---------------- 写真 ---------------- */
/* 送る前にスマホの中で小さくする（お店：長い辺1280px／顔：480pxの正方形） */
function shrink(file, kind){
  return new Promise((ok, ng)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const c = document.createElement("canvas"), x = c.getContext("2d");
      if (kind === "staff"){
        const side = Math.min(img.width, img.height), sx = (img.width-side)/2, sy = (img.height-side)/2;
        c.width = c.height = 480; x.drawImage(img, sx, sy, side, side, 0, 0, 480, 480);
      } else {
        const r = Math.min(1, 1280/Math.max(img.width, img.height));
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r); x.drawImage(img, 0, 0, c.width, c.height);
      }
      URL.revokeObjectURL(url);
      let q = .82, data = c.toDataURL("image/jpeg", q);
      while (data.length > 600000 && q > .4){ q -= .1; data = c.toDataURL("image/jpeg", q); }
      ok(data);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); ng(new Error("read")); };
    img.src = url;
  });
}
function wirePhotos(kind){

  const done = (r, okText) => { if (r && r.ok){ m.className="msg ok"; m.textContent=okText; return true; } m.className="msg err";
    m.textContent = r && r.error==="agree" ? "顔写真を送る前に、いちばん上の同意にチェックを入れてください。" : r && r.error==="size" ? "写真が大きすぎました。別の写真でお試しください。" : "写真を保存できませんでした。もう一度お試しください。"; return false; };

    document.querySelectorAll("input[data-slot]").forEach(inp=>inp.onchange=async()=>{
      const f = inp.files && inp.files[0]; inp.value = ""; if (!f) return;
      busy("写真を送っています…");
      let data; try { data = await shrink(f, "salon"); } catch(e){ return done(null); }
      const r = await api({type:"upload_photo", kind:"salon", key:KEY, slot:+inp.dataset.slot, mime:"image/jpeg", data});
      if (done(r, "写真を保存しました。診断結果にすぐ反映されます。")){ D.photos = D.photos || []; D.photos[+inp.dataset.slot-1] = data; keepAndRender(); }
    });
    document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      busy("削除しています…");

      if (done(r, "写真を削除しました。")){ D.photos[+b.dataset.del-1] = ""; keepAndRender(); }
    });
  } else {
    $("faceIn").onchange = async()=>{
      const f = $("faceIn").files && $("faceIn").files[0]; $("faceIn").value = ""; if (!f) return;
      if (!$("agree").checked){ m.className="msg err"; m.textContent="顔写真を送る前に、いちばん上の同意にチェックを入れてください。"; window.scrollTo({top:0,behavior:"smooth"}); return; }
      busy("写真を送っています…");
      let data; try { data = await shrink(f, "staff"); } catch(e){ return done(null); }
      const r = await api({type:"upload_photo", kind:"staff", key:KEY, mime:"image/jpeg", data, agree:true});
      if (done(r, "顔写真を保存しました。")){ D.photo = data; keepAndRender(); }
    };
    if ($("faceDel")) $("faceDel").onclick = async()=>{
      busy("削除しています…");
      const r = await api({type:"delete_photo", kind:"staff", key:KEY});
      if (done(r, "顔写真を削除しました。")){ D.photo = ""; keepAndRender(); }
    };
  }
}
