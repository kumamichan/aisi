<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AISI ご来店アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラム。AISIのひとこと → ★ → また行きたい → 施術 → ひとこと → 送信 */
:root{
  --night:#141a26; --night-2:#1e2738; --paper:#f3f1ec; --card:#fbfaf7; --ink:#1b2130; --ink-soft:#5a6274;
  --line:#ddd8cd; --accent:#d9b77a; --accent-ink:#2a2112; --star:#e2a93b; --warn:#b23b2a;
  --font-voice:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);line-height:1.75;font-size:15px}
header{background:var(--night);color:var(--paper);padding:20px max(16px,env(safe-area-inset-left,0px))}
.hin{max-width:560px;margin:0 auto;display:grid;gap:6px}
.logo{font-family:var(--font-voice);letter-spacing:.32em;font-size:1.2rem}
h1{margin:0;font-family:var(--font-voice);font-size:1.3rem;line-height:1.5}
.sub{margin:0;color:#c9ced8;font-size:.86rem}
main{max-width:560px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 60px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
section h2{margin:0;font-size:1rem}
.stars{display:flex;gap:6px}
.stars button{font-size:2.1rem;line-height:1;background:none;border:0;cursor:pointer;color:#d6d0c4;padding:2px;transition:transform .15s}
.stars button.on{color:var(--star)}
@media (hover:hover){.stars button:hover{transform:scale(1.12)}}
.slabel{font-size:.84rem;color:var(--ink-soft);min-height:1.4em}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:inherit;font-size:.92rem;border:1px solid #cfc9bd;background:#fff;color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer}
.opt.on{background:var(--night-2);border-color:var(--night-2);color:#fff;font-weight:700}
textarea{font:inherit;font-size:16px;width:100%;min-height:90px;border:1px solid #cfc9bd;border-radius:6px;padding:10px 12px;resize:vertical}
.btn{font:inherit;border:0;border-radius:999px;background:var(--night-2);color:#fff;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:.86rem;color:var(--warn);margin:0}
.center{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.center b{font-family:var(--font-voice);font-size:1.3rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="hin"><div class="logo">AISI</div><h1 id="title">ご来店アンケート</h1><p class="sub" id="sub">1分で終わります。</p></div></header>
<main id="main">
  <div class="center" id="loading">読み込み中…</div>
  <form id="form" hidden novalidate>
    <section><h2>満足度は？</h2>
      <div class="stars" id="stars" role="radiogroup" aria-label="満足度">
        <button type="button" data-v="1" aria-label="星1">★</button><button type="button" data-v="2" aria-label="星2">★</button><button type="button" data-v="3" aria-label="星3">★</button><button type="button" data-v="4" aria-label="星4">★</button><button type="button" data-v="5" aria-label="星5">★</button>
      </div><div class="slabel" id="slabel">★を押して選んでください</div></section>
    <section style="margin-top:14px"><h2 id="againQ">また行きたい？</h2><div class="opts" id="again"></div></section>
    <section style="margin-top:14px"><h2 id="didQ">予約したメニューの施術は受けられた？</h2><div class="opts" id="did"></div></section>
    <section style="margin-top:14px"><h2>ひとこと（任意）</h2><textarea id="comment" maxlength="300" placeholder="よかったところ、気になったところなど。お店に伝わります。"></textarea></section>
    <section style="margin-top:14px"><p class="msg" id="err" hidden></p><button class="btn" type="submit" id="go" disabled>送信する</button></section>
  </form>
  <div class="center" id="done" hidden><b>ありがとうございました</b><p>いただいた声は、お店のサービスと、AISIのおすすめに活かします。<br>また髪のことで迷ったら、いつでもAISIに聞いてください。</p></div>
</main>
<script>
/* GASのウェブアプリのURL（index.html と同じもの） */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyGZEEo6pLimN1SLQYxvyYozY0_DTm9qXwIkao2G_JE6EFxr1RzqCcrvnD_GDO0dEI4vA/exec";
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search), R = q.get("r") || "", T = q.get("t") || "";
const LABEL = ["", "不満だった", "少し不満", "ふつう", "満足", "とても満足"];
let star = 0, again = "", did = "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function opts(box, list, set){ $(box).innerHTML = list.map(v => `<button type="button" class="opt" data-v="${esc(v)}" aria-pressed="false">${esc(v)}</button>`).join("");
  $(box).querySelectorAll(".opt").forEach(b => b.onclick = () => { $(box).querySelectorAll(".opt").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); }); set(b.dataset.v); }); }
async function init(){
  try {
    const r = await (await fetch(`${GAS_URL}?action=survey&r=${encodeURIComponent(R)}&t=${encodeURIComponent(T)}`)).json();
    $("loading").hidden = true;
    if (!r.ok) { $("main").innerHTML = `<div class="center">このアンケートは見つかりませんでした。メールのリンクから、もう一度開いてください。</div>`; return; }
    if (r.done) { $("done").hidden = false; $("title").textContent = r.salon; $("sub").textContent = "アンケートはすでに受け付けています。"; return; }
    $("title").textContent = r.salon + " はいかがでしたか？";
    $("sub").textContent = [r.when, r.staff ? "担当 " + r.staff + "さん" : "", "1分で終わります"].filter(Boolean).join(" ・ ");
    $("againQ").textContent = r.salon + " に、また行きたい？";
    if (r.menu) $("didQ").textContent = "予約したメニュー（" + r.menu + "）の施術は受けられた？";
    opts("again", r.again, v => again = v); opts("did", r.did, v => did = v);
    $("form").hidden = false;
  } catch (e) { $("loading").textContent = "読み込めませんでした。通信を確認して、もう一度開いてください。"; }
}
$("stars").querySelectorAll("button").forEach(b => b.onclick = () => {
  star = +b.dataset.v; $("stars").querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= star));
  $("slabel").textContent = "★" + star + "　" + LABEL[star]; $("go").disabled = false;
});
$("form").addEventListener("submit", async e => {
  e.preventDefault(); if (!star) return;
  const b = $("go"); b.disabled = true; b.textContent = "送信中…";
  try {
    const r = await (await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ type: "survey", r: R, t: T, star, again, did, comment: $("comment").value.trim() }) })).json();
    if (!r.ok) throw 0;
    $("form").hidden = true; $("done").hidden = false; window.scrollTo(0, 0);
  } catch (er) { $("err").hidden = false; $("err").textContent = "送信できませんでした。もう一度お試しください。"; b.disabled = false; b.textContent = "送信する"; }
});
init();
</script>
</body>
</html>
