<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぴたリスト｜AISIの質問チェック（美容師さん向け）</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 美容師さんが、AISIの質問をプロの目でチェックするページ。1問ずつ、AISIが話しかける形 */
:root{ --night:#141a26; --night2:#1e2738; --paper:#f3f1ec; --ink:#1b2130; --soft:#5a6274; --line:#ddd8cd; --accent:#d9b77a; --accent-ink:#3b2a08; --green:#06c755; --green-d:#05a647;
  --voice:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; --ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#26314a 0%,var(--night) 70%);color:var(--paper);font-family:var(--ui);min-height:100vh;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#b9c0cf}
.top b{font-family:var(--voice);font-size:1.05rem;color:var(--paper);letter-spacing:.06em}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:10px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.prog{font-size:.78rem;color:#b9c0cf;display:flex;justify-content:space-between}
.stage{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:start;margin-top:16px}
.aisi{width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);background:#0d121c}
.aisi img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.bubble{background:var(--paper);color:var(--ink);border-radius:4px 16px 16px 16px;padding:14px 16px}
.bubble .who{font-size:.7rem;letter-spacing:.2em;color:#8a6a2e;font-weight:700}
.voice{font-family:var(--voice);font-size:1.08rem;margin:4px 0 0}
.qbox{margin:10px 0 0;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:1.05rem;font-weight:700;white-space:pre-line}
.lead{font-size:.8rem;color:var(--soft);margin:8px 0 0}
.opts{margin:8px 0 0;padding:0;list-style:none;font-size:.88rem;color:var(--soft)}
.opts li::before{content:"・"}
.what{font-size:.76rem;color:var(--soft);margin-top:6px}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{width:100%;background:rgba(243,241,236,.94);color:var(--ink);border:0;border-radius:8px;padding:14px 16px;font:inherit;font-size:1rem;font-weight:500;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer}
.choice.picked{background:#fff;font-weight:700;box-shadow:0 0 0 3px var(--accent),0 3px 0 rgba(0,0,0,.25)}
.choice.picked::before{content:"✓ ";color:#8a6a2e}
.choice.primary{background:var(--green);color:#fff;font-weight:700;box-shadow:0 3px 0 var(--green-d)}
.choice[disabled]{opacity:.45;cursor:default}
.choice:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.field{margin-top:14px}
.field label{display:block;font-size:.88rem;font-weight:700;margin-bottom:6px}
.field small{display:block;color:#b9c0cf;font-weight:400;font-size:.76rem}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.96);color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid rgba(255,255,255,.3);background:transparent;color:var(--paper);border-radius:99px;padding:9px 14px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--paper)}
.chip.on::before{content:"✓ "}
.chip small{opacity:.75;margin-left:4px}
.back{background:none;border:0;color:#9aa3b5;font:inherit;font-size:.85rem;margin-top:14px;cursor:pointer;padding:4px 0}
.err{color:#ffb4a8;font-weight:700;font-size:.9rem;min-height:1.2em;margin:8px 0 0}
.note{font-size:.78rem;color:#9aa3b5;margin-top:18px}
.done{text-align:center}
.secs{margin:12px 0 0;padding:0;list-style:none;text-align:left;font-size:.9rem}
.secs li{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>ぴたリスト</b><span>美容師さん向け・質問チェック</span></div>
  <div id="app"></div>
</div>

  }
  render();
})();
